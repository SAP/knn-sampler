default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# pre-commit.ci does not provide Poetry. GitHub Actions runs the full typecheck;
# the local hook remains enabled in the Poetry development environment.
ci:
  skip: [mypy]
repos:

- repo: https://github.com/jorisroovers/gitlint
  rev: v0.19.1
  hooks:
    - id: gitlint
      args: [--staged, --contrib=CT1, --ignore=B6, --msg-filename]

- repo: https://github.com/python-poetry/poetry
  rev: 2.5.1
  hooks:
    - id: poetry-check
    - id: poetry-lock
    - id: poetry-install

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
      - id: trailing-whitespace
        exclude: ^.*\.md$
      - id: end-of-file-fixer
      - id: check-builtin-literals
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: pretty-format-json
        args: [--autofix, --no-ensure-ascii, --no-sort-keys]
      - id: check-ast
      - id: debug-statements
      - id: check-docstring-first

# mypy runs from the Poetry environment (not mirrors-mypy's isolated venv):
# it needs the project's dependencies and stubs (numpy, pandas, pandas-stubs,
# line_profiler) to type-check the codebase with the shared [tool.mypy] config.
- repo: local
  hooks:
    - id: mypy
      name: mypy
      entry: poetry run mypy
      language: system
      types: [python]
      require_serial: true
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.17.0
  hooks:
    # Run the linter.
    - id: ruff
      types_or: [ python, pyi, jupyter ]
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
      types_or: [ python, pyi, jupyter ]
